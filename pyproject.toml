[project]
name = "crewai-latex-book"
version = "1.0.0"
description = "Exercise 03 — CrewAI multi-agent pipeline that produces a ~15-page LaTeX book"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Renat Karimov" },
    { name = "Alon Engel" },
]
dependencies = [
    "crewai>=0.130.0",
    "crewai-tools>=0.47.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "pypdf>=5.0.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
bookgen = "bookgen.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/bookgen"]

[tool.hatch.build.targets.wheel.force-include]
"src/bookgen" = "bookgen"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/bookgen"]
omit = ["src/bookgen/main.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Guidelines V3 ruleset: style, pyflakes, warnings, imports, naming,
# pyupgrade, bugbear, comprehensions, simplify. E501 handled by the formatter.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
